footer_fields:
  - label: Hinweis
    value: Die Belastungsniveaus für einzelne Jahre können deutlich schwanken, dies gilt insbesondere bei kleineren Stichproben. So ist z.B. bekannt, dass junge Eissturmvögel mehr Plastik in den Mägen haben als adulte Tiere. Ihr Anteil schwankt über die Jahre. Um die aktuelle Situation verlässlich einschätzen zu können empfiehlt sich daher die Betrachtung von 5-Jahresperioden, da auf diese Weise kleine Stichproben oder Jahre mit besonders vielen jungen Eissturmvögeln ausgeglichen werden und so ein verlässlicheres Bild geliefert werden kann.
